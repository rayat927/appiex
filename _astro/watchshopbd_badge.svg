<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#050C16"/>
      <stop offset="100%" stop-color="#02060D"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="50" fill="url(#watchGrad)"/>
  <!-- Outer Watch Bezel -->
  <circle cx="50" cy="46" r="30" fill="#0E2238" stroke="url(#cyanAccent)" stroke-width="2"/>
  <circle cx="50" cy="46" r="24" fill="#040D1A" stroke="#1E3A5F" stroke-width="1"/>
  <!-- Bezel Hour Markers -->
  <line x1="50" y1="24" x2="50" y2="28" stroke="#38BDF8" stroke-width="2"/>
  <line x1="50" y1="64" x2="50" y2="68" stroke="#38BDF8" stroke-width="2"/>
  <line x1="28" y1="46" x2="32" y2="46" stroke="#38BDF8" stroke-width="2"/>
  <line x1="68" y1="46" x2="72" y2="46" stroke="#38BDF8" stroke-width="2"/>
  <!-- Watch Hands (pointing to 10:10 classic aesthetic) -->
  <line x1="50" y1="46" x2="38" y2="36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="64" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="46" x2="50" y2="60" stroke="#F43F5E" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="50" cy="46" r="3" fill="#38BDF8"/>
  <text x="50" y="88" fill="#E2E8F0" font-family="'Google Sans', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1.2">WATCHSHOP BD</text>
</svg>
