name: Appiex live deployment diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/live-deploy-diagnostics-20261106
    paths:
      - '.github/workflows/live-deployment-diagnostics.yml'
      - 'src/lib/appiex-html-polish.mjs'
      - 'styles/appiex-editorial-polish.css'
      - 'vercel.json'
      - 'index.html'
      - '*.html'
      - 'blog/**'
      - 'scripts/check-editorial-renderer.mjs'
      - 'styles/appiex-related-services.css'
      - 'scripts/apply-sitewide-seo.mjs'
      - 'styles/appiex-home-sections-v3.css'
      - 'scripts/check-home-sections-v3.mjs'

permissions:
  contents: read

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deployed HTML, CSS and article response
        shell: bash
        run: |
          set -u
          echo "Repository revision: ${GITHUB_SHA}"
          cat > /tmp/inspect.sh <<'SH'
          inspect() {
            local label="$1"
            local url="$2"
            local outfile="/tmp/appiex-${label}.body"
            local headers="/tmp/appiex-${label}.headers"
            local code
            code=$(curl -sS -L --max-time 30 --retry 2 \
              -A 'Appiex-Deployment-Diagnostics/1.0' \
              -H 'Cache-Control: no-cache' \
              -D "$headers" -o "$outfile" \
              -w '%{http_code}' "$url") || code="CONNECTION_FAILED"
            echo "### ${label}"
            echo "URL: ${url}"
            echo "HTTP: ${code}"
            if test -f "$headers"; then
              grep -Ei '^(HTTP/|x-vercel-id:|x-vercel-cache:|x-matched-path:|x-powered-by:|server:|age:|cache-control:|x-robots-tag:|location:)' "$headers" | tail -18 || true
            fi
            if test -f "$outfile"; then
              echo "Bytes: $(wc -c < "$outfile")"
              echo "Shared design CSS reference: $(grep -c 'appiex-editorial-polish.css' "$outfile" || true)"
              echo "Current homepage hero: $(grep -c 'AI Automation for Growth' "$outfile" || true)"
              echo "Homepage polish class: $(grep -c 'appiex-home-polished' "$outfile" || true)"
              echo "Current design marker: $(grep -c 'APPIEX HOME EDITORIAL REFRESH' "$outfile" || true)"
              echo "Blog reading progress class: $(grep -c 'appiex-reading-meter' "$outfile" || true)"
              echo "Legacy wrong H1 snippet: $(grep -c 'Complete</span>.*Guide' "$outfile" || true)"
            fi
            echo
          }
          SH
          source /tmp/inspect.sh
          inspect home "https://appiex.com/?appiex_check=${GITHUB_SHA}"
          inspect www "https://www.appiex.com/?appiex_check=${GITHUB_SHA}"
          inspect css "https://appiex.com/styles/appiex-editorial-polish.css?appiex_check=${GITHUB_SHA}"
          inspect guide "https://appiex.com/blog/ai-agents-vs-n8n-automation-for-business?appiex_check=${GITHUB_SHA}"
          inspect legacy "https://appiex.com/blog/how-we-reduced-website-load-time-5-2s-to-1-4s?appiex_check=${GITHUB_SHA}"
          inspect blogcss "https://appiex.com/styles/appiex-blog-v2.css?appiex_check=${GITHUB_SHA}"
          inspect service "https://appiex.com/web-development?appiex_check=${GITHUB_SHA}"
          inspect strategy "https://appiex.com/digital-strategy?appiex_check=${GITHUB_SHA}"
          inspect aibiz "https://appiex.com/ai-automation?appiex_check=${GITHUB_SHA}"
          inspect seo "https://appiex.com/seo-marketing?appiex_check=${GITHUB_SHA}"
          inspect relatedcss "https://appiex.com/styles/appiex-related-services.css?appiex_check=${GITHUB_SHA}"
          inspect homev3css "https://appiex.com/styles/appiex-home-sections-v3.css?appiex_check=${GITHUB_SHA}"
          echo "## Production diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'AI Automation for Growth' /tmp/appiex-home.body 2>/dev/null &&
             grep -q 'APPIEX HOME EDITORIAL REFRESH' /tmp/appiex-css.body 2>/dev/null &&
             grep -q 'appiex-blog-v2' /tmp/appiex-legacy.body 2>/dev/null &&
             grep -q 'appiex-related-services__grid' /tmp/appiex-service.body 2>/dev/null &&
             grep -q 'Appiex editorial recommendations v2' /tmp/appiex-relatedcss.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-service.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-strategy.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-aibiz.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-seo.body &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-service.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-strategy.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-aibiz.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-seo.body | wc -l)" -eq 3 &&
             ! grep -q 'id="specialized-service-hubs"' /tmp/appiex-service.body &&
             ! grep -q 'id="specialized-service-hubs"' /tmp/appiex-aibiz.body &&
             grep -q 'apx-solution-grid' /tmp/appiex-home.body &&
             grep -q 'apx-faq-stack' /tmp/appiex-home.body &&
             grep -q 'apx-next-step' /tmp/appiex-home.body &&
             grep -q 'cohesive editorial decision system' /tmp/appiex-homev3css.body &&
             ! grep -q 'Is Appiex the Right Fit for Your Project' /tmp/appiex-home.body 2>/dev/null; then
            echo "- **PASS:** Live homepage, V3 design CSS, blog and service links contain the latest merged source." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **DRIFT:** Production does not contain the latest homepage or blog design; inspect Vercel project Git integration, production branch, latest deployment, build output, and domain assignment." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Review diagnostic logs for HTTP status and Vercel response headers." >> "$GITHUB_STEP_SUMMARY"
      - name: Determine likely source repository from live HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/rayat927/appiex/main/index.html -o /tmp/appiex-rayat-index.html
          curl -fsSL --max-time 30 https://raw.githubusercontent.com/001rafsan/appiex/main/index.html -o /tmp/appiex-rafsan-index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          live = Path('/tmp/appiex-home.body').read_text(errors='replace')
          matches = []
          for repo, p in [('rayat927/appiex','/tmp/appiex-rayat-index.html'), ('001rafsan/appiex','/tmp/appiex-rafsan-index.html')]:
              source = Path(p).read_text(errors='replace')
              stride = max(1, (len(live) - 160) // 130)
              pieces = [live[i:i+160] for i in range(0,max(1,len(live)-160),stride)]
              score = sum(1 for piece in pieces if piece in source) / max(1,len(pieces))
              title = re.search(r'<title[^>]*>(.*?)</title>',source,re.I|re.S)
              matches.append((score,repo,title.group(1) if title else 'no title',len(source)))
          live_title = re.search(r'<title[^>]*>(.*?)</title>',live,re.I|re.S)
          print('Live title:',live_title.group(1) if live_title else 'not found')
          for score,repo,title,size in sorted(matches,reverse=True):
              print(f'Approximate source similarity {repo}: {score:.1%} | bytes={size} | title={title}')
          print('This is a content comparison, not proof of Vercel project integration.')
          PY
      - name: Fail when production still uses an outdated deployment
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'AI Automation for Growth' /tmp/appiex-home.body &&
             grep -q 'APPIEX HOME EDITORIAL REFRESH' /tmp/appiex-css.body &&
             grep -q 'appiex-blog-v2' /tmp/appiex-legacy.body &&
             grep -q 'appiex-related-services__grid' /tmp/appiex-service.body &&
             grep -q 'Appiex editorial recommendations v2' /tmp/appiex-relatedcss.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-service.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-strategy.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-aibiz.body &&
             grep -q 'appiex-related-services--v2' /tmp/appiex-seo.body &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-service.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-strategy.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-aibiz.body | wc -l)" -eq 3 &&
             test "$(grep -o 'class="appiex-related-article"' /tmp/appiex-seo.body | wc -l)" -eq 3 &&
             ! grep -q 'id="specialized-service-hubs"' /tmp/appiex-service.body &&
             ! grep -q 'id="specialized-service-hubs"' /tmp/appiex-aibiz.body &&
             grep -q 'apx-solution-grid' /tmp/appiex-home.body &&
             grep -q 'apx-faq-stack' /tmp/appiex-home.body &&
             grep -q 'apx-next-step' /tmp/appiex-home.body &&
             grep -q 'cohesive editorial decision system' /tmp/appiex-homev3css.body &&
             ! grep -q 'Is Appiex the Right Fit for Your Project' /tmp/appiex-home.body; then
            echo "Production serves homepage V3, 3 illustrated recommendations per checked service, accessible FAQ and SEO CSS."
          else
            echo "::error::Production appiex.com is not serving the merged design/SEO fixes. Verify the exact Vercel project serving this domain, its connected Git repository and branch, build status, and deployment promotion."
            exit 1
          fi
