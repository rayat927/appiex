name: Blog SEO checks
on:
  pull_request:
    paths:
      - 'blog/**'
      - '*.html'
      - 'authors/**'
      - 'styles/appiex-related-services.css'
      - 'scripts/apply-sitewide-seo.mjs'
      - 'scripts/audit-sitewide-seo.mjs'
      - 'scripts/data/page-search-intents.json'
      - 'scripts/check-search-intents.mjs'
      - 'scripts/check-home-growth-copy.mjs'
      - 'scripts/check-blog-layout-v2.mjs'
      - 'scripts/rebuild-service-related.mjs'
      - 'scripts/check-service-related.mjs'
      - 'blog.html'
      - 'index.html'
      - 'styles/appiex-gaming.css'
      - 'scripts/appiex-gaming.js'
      - 'scripts/check-gaming-service.mjs'
      - 'styles/appiex-gaming-premium.css'
      - 'scripts/appiex-gaming-play.js'
      - 'scripts/check-gaming-play.mjs'
      - 'vercel.json'
      - 'scripts/check-vercel-next-config.mjs'
      - 'src/app/**'
      - 'src/lib/**'
      - 'styles/appiex-editorial-polish.css'
      - 'scripts/appiex-reading-progress.js'
      - 'scripts/check-editorial-renderer.mjs'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check-blog-seo.mjs'
      - '.github/workflows/blog-seo-check.yml'
      - 'seo-marketing.html'
      - 'best-software-agency.html'
      - 'scripts/check-site-seo.mjs'
      - 'scripts/seo-conversion-tracker.js'
      - 'scripts/check-lead-tracking.mjs'
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '*.html'
      - 'authors/**'
      - 'styles/appiex-related-services.css'
      - 'scripts/apply-sitewide-seo.mjs'
      - 'scripts/audit-sitewide-seo.mjs'
      - 'scripts/data/page-search-intents.json'
      - 'scripts/check-search-intents.mjs'
      - 'scripts/check-blog-layout-v2.mjs'
      - 'scripts/rebuild-service-related.mjs'
      - 'scripts/check-service-related.mjs'
      - 'blog.html'
      - 'sitemap.xml'
      - 'scripts/check-blog-seo.mjs'
      - 'scripts/check-site-seo.mjs'
      - 'seo-marketing.html'
      - 'best-software-agency.html'
      - 'scripts/seo-conversion-tracker.js'
      - 'scripts/check-lead-tracking.mjs'
      - 'index.html'
      - 'vercel.json'
      - 'scripts/check-vercel-next-config.mjs'
      - 'src/app/**'
      - 'src/lib/**'
      - 'styles/appiex-editorial-polish.css'
      - 'scripts/appiex-reading-progress.js'
      - 'scripts/check-editorial-renderer.mjs'
jobs:
  blog-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate blog indexability and sitemap
        run: node scripts/check-blog-seo.mjs
      - name: Guard against old static Vercel configuration
        run: node scripts/check-vercel-next-config.mjs
      - name: Check all blog HTML against shared editorial renderer
        run: node scripts/check-editorial-renderer.mjs
      - name: Check JavaScript syntax
        run: |
          node --check 'src/app/[[...slug]]/route.js'
          node --check src/lib/appiex-html-polish.mjs
          node --check scripts/appiex-reading-progress.js

  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies using Vercel-compatible npm install
        run: npm install --no-audit --no-fund
      - name: Build Next.js production bundle
        run: npm run build

  lead-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conversion events and contact form syntax
        run: node scripts/check-lead-tracking.mjs

  site-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical sitemap URLs, metadata and JSON-LD
        run: node scripts/check-site-seo.mjs
      - name: Verify gaming page, SEO and playable arcade interactions
        run: |
          node --check scripts/appiex-gaming.js
          node --check scripts/appiex-gaming-play.js
          node --check scripts/check-gaming-play.mjs
          node scripts/check-gaming-service.mjs
          node scripts/check-gaming-play.mjs
      - name: Audit SEO for all public sitemap pages
        run: node scripts/audit-sitewide-seo.mjs --strict
      - name: Check sitemap pages follow the approved metadata and linking policy
        run: node scripts/apply-sitewide-seo.mjs --check
      - name: Verify mapped primary and supporting search intents for all indexable public URLs
        run: node scripts/check-search-intents.mjs
      - name: Verify homepage business growth positioning and six service specialties
        run: node scripts/check-home-growth-copy.mjs
      - name: Check service links, illustrated recommendations and local image availability
        run: |
          node scripts/rebuild-service-related.mjs --check
          node scripts/check-service-related.mjs
      - name: Verify all blog layouts and indexability are preserved
        run: |
          node scripts/check-blog-layout-v2.mjs
          node scripts/materialize-editorial-html.mjs --check
