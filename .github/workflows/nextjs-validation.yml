name: Validate Next.js migration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check migration, SEO URLs, and security
        run: npm run check:migration
      - name: Build Next.js production bundle
        run: npm run build
      - name: Test admin authentication and visitor API
        run: node scripts/verify-admin-security.mjs
