name: Verify Appiex performance changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  performance-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate performance and SEO invariants
        run: node scripts/verify-performance.mjs
      - name: Build Next.js production bundle
        run: npm run build
