name: Gaming V2 live deployment verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gaming.html'
      - 'styles/gaming-v2.css'
      - 'scripts/appiex-rift-shift.js'
      - 'scripts/check-gaming-rebuild.mjs'
      - '.github/workflows/gaming-live-check.yml'

permissions:
  contents: read

jobs:
  live-gaming:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm the new design is actually deployed
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          for attempt in $(seq 1 15); do
            status=$(curl -sSL --max-time 22 -H 'Cache-Control: no-cache' \
              -o /tmp/appiex-gaming-v2.html -w '%{http_code}' \
              "https://appiex.com/gaming?deploy_check=$GITHUB_SHA" || true)
            if [ "$status" = "200" ] &&
               grep -Fq 'styles/gaming-v2.css?v=20261107-new' /tmp/appiex-gaming-v2.html &&
               grep -Fq 'id="gx-main-title"' /tmp/appiex-gaming-v2.html &&
               grep -Fq 'id="arcade-canvas"' /tmp/appiex-gaming-v2.html &&
               grep -Fq 'id="arcade-start"' /tmp/appiex-gaming-v2.html &&
               grep -Fq 'scripts/appiex-rift-shift.js' /tmp/appiex-gaming-v2.html &&
               grep -Fq 'rel="canonical" href="https://appiex.com/gaming"' /tmp/appiex-gaming-v2.html; then
              deployed=1
              break
            fi
            echo "Attempt $attempt: new gaming page not deployed yet (HTTP $status)"
            sleep 10
          done
          if [ "$deployed" -ne 1 ]; then
            echo "::error::The redesigned gaming page has not reached production; check Vercel status/limits."
            exit 1
          fi
          echo "PASS: New gaming design and playable arcade verified in production."
      - name: Verify actual published CSS, JavaScript and indexability
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 \
            "https://appiex.com/styles/gaming-v2.css?v=$GITHUB_SHA" \
            -o /tmp/appiex-gaming-v2.css
          grep -Fq 'GAMING / APPIEX' /tmp/appiex-gaming-v2.css
          grep -Fq 'prefers-reduced-motion' /tmp/appiex-gaming-v2.css
          curl -fsSL --max-time 25 \
            "https://appiex.com/scripts/appiex-rift-shift.js?v=$GITHUB_SHA" \
            -o /tmp/appiex-rift-shift.js
          grep -Fq 'RIFT SHIFT' /tmp/appiex-rift-shift.js
          grep -Fq 'requestAnimationFrame' /tmp/appiex-rift-shift.js
          curl -fsSL -D /tmp/appiex-gaming-v2.headers \
            -o /dev/null "https://appiex.com/gaming?seo_check=$GITHUB_SHA"
          if grep -iE '^x-robots-tag:.*noindex' /tmp/appiex-gaming-v2.headers; then
            echo "::error::Gaming page is blocked by X-Robots-Tag."
            exit 1
          fi
          echo "PASS: New CSS, playable JS and indexable production headers."
