name: Appiex trust and security release checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'refer.html'
      - 'ai-automation.html'
      - 'web-development.html'
      - 'start-project.html'
      - 'privacy-policy.html'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/appiex-trust-security.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test buyer trust and privacy
        run: node scripts/check-appiex-trust-security.mjs
      - name: Test project-fit lead funnel
        run: node scripts/check-qualified-funnel.mjs
      - name: Install dependencies for production-build verification
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify production build
        run: npm run build
