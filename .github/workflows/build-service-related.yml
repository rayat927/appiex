name: Build illustrated service resource sections

on:
  push:
    branches: [feat/service-related-blog-thumbnails-20261106]
    paths:
      - '.github/workflows/build-service-related.yml'
      - 'scripts/rebuild-service-related.mjs'
      - 'scripts/check-service-related.mjs'
      - 'styles/appiex-related-services.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appiex-service-related-redesign
  cancel-in-progress: false

jobs:
  build-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify generator and validator syntax
        run: |
          node --check scripts/rebuild-service-related.mjs
          node --check scripts/check-service-related.mjs
      - name: Update source HTML using indexed blog metadata and existing thumbnails
        run: node scripts/rebuild-service-related.mjs
      - name: Validate design, SEO, image sources and links
        run: |
          node scripts/rebuild-service-related.mjs --check
          node scripts/check-service-related.mjs
          node scripts/audit-sitewide-seo.mjs --strict
          node scripts/apply-sitewide-seo.mjs --check
          node scripts/check-site-seo.mjs
          node scripts/check-blog-seo.mjs
          node scripts/check-blog-layout-v2.mjs
          node scripts/check-editorial-renderer.mjs
          node scripts/check-home-sections-v3.mjs
          node scripts/check-lead-tracking.mjs
      - name: Check Next.js production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified HTML pages to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All related content already synchronized."
            exit 0
          fi
          echo "Changed HTML pages:"
          git diff --cached --name-only
          git commit -m "feat: add illustrated related article recommendations to service pages"
          git push origin HEAD:feat/service-related-blog-thumbnails-20261106
