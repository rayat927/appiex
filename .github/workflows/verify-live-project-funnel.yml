name: Verify qualified lead funnel live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'start-project.html'
      - 'scripts/start-project-funnel.js'
      - 'styles/start-project-funnel.css'
      - 'styles/qualified-lead-entry.css'
      - 'scripts/check-live-project-funnel.mjs'
      - '.github/workflows/verify-live-project-funnel.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live funnel assets and buyer journeys
        run: node scripts/check-live-project-funnel.mjs
