name: Appiex Production SEO Evidence
on:
  pull_request:
    paths:
      - 'scripts/audit-live-indexing.mjs'
      - '.github/workflows/production-seo-evidence.yml'
  workflow_dispatch:
jobs:
  live-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check script syntax
        run: node --check scripts/audit-live-indexing.mjs
      - name: Inventory blog SEO and content overlap
        run: node scripts/audit-blog-content-inventory.mjs
      - name: Check production sitemap and redirects
        if: github.event_name != 'pull_request'
        run: node scripts/audit-live-indexing.mjs
      - name: Upload audit evidence even if failures occur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appiex-live-indexing-evidence
          path: |
            artifacts/appiex-live-indexing-report.json
            artifacts/appiex-blog-content-inventory.json
          if-no-files-found: warn
