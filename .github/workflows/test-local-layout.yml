name: Validate static layout before release
on:
  push:
    branches: [fix/blog-cross-page-typography-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test local static pages and navigation
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/appiex-server.log 2>&1 &
          python scripts/test-local-layout.py
